<!DOCTYPE html>
<html>
<head>

<title>S & B Wedding</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#F5F1EA;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.container{
    width:92%;
    max-width:900px;
    margin-top:-280px;
}

h1{
    color:#5E7059;
    font-family:'Great Vibes', cursive;
    font-size:90px;
    line-height:1.1;
    margin-bottom:30;
    font-weight:400;
}

.seal{
    width:90px;
    height:90px;
    background:#7B2D26;
    border-radius:50%;
    color:white;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    margin:auto;
    cursor:pointer;
    text-decoration:none;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.tap{
    color:#5E7059;
    margin-top:25px;
    font-size:56px;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    text-decoration:none;
}

.envelope{
    width:100%;
    max-width:450px;
    height:260px;
    background:#A8B493;
    margin:40px auto;
    border-radius:8px;
    position:relative;
}

.envelope:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:225px solid transparent;
    border-right:225px solid transparent;
    border-top:140px solid #93A07F;
}

.intro{
    color:#5E7059;
    font-family:'Cormorant Garamond', serif;
    font-size:36px;
    letter-spacing:2px;
    margin-bottom:10px;
    text-transform:uppercase;
}

</style>

</head>

<body>

<div class="container">

    <p class="intro">
    A HEARTFELT INVITATION FROM
</p>

    <h1>
        Shiela Mae
        <br>
        &
        <br>
        Brylle Jhon
    </h1>

    <a href="wedding.html">

    <img src="images/envelope.jpg"
     style="width:100%;height:auto;display:block;margin:0 auto;"

     </a>
   

    <div class="tap">
        Tap to Open
    </div>

</div>

</body>
</html>
