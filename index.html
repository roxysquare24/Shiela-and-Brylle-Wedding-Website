<!DOCTYPE html>
<html>
<head>

<title>S & B Wedding</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#F5F1EA;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.container{
    width:92%;
    max-width:900px;
    margin-top:-280px;
}

h1{
    color:#5E7059;
    font-family:'Great Vibes', cursive;
    font-size:140px;
    line-height:1.1;
    margin-bottom:30px;
    font-weight:400;
}

.seal{
    width:90px;
    height:90px;
    background:#7B2D26;
    border-radius:50%;
    color:white;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    margin:auto;
    cursor:pointer;
    text-decoration:none;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.tap{
    color:#5E7059;
    margin-top:10px;
    font-size:42px;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
}

.envelope{
    width:100%;
    max-width:450px;
    height:260px;
    background:#A8B493;
    margin:40px auto;
    border-radius:8px;
    position:relative;
}

.envelope:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:225px solid transparent;
    border-right:225px solid transparent;
    border-top:140px solid #93A07F;
}

.intro{
    color:#5E7059;
    font-family:'Cormorant Garamond', serif;
    font-size:42px;
    letter-spacing:2px;
    margin-top:-120px;
    text-transform:uppercase;
}

.open-link,
.open-link:link,
.open-link:visited,
.open-link:hover,
.open-link:active{
    text-decoration:none;
    color:#5E7059;
    display:block;
}

.fade-out{
    animation: fadeOut 1s ease forwards;
}

@keyframes fadeOut{
    0%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.08);
    }
}

</style>

</head>

<script>

function openInvitation(event){

    event.preventDefault();

    document.querySelector(".container")
        .classList.add("fade-out");

    setTimeout(() => {
        window.location.href = "wedding.html";
    }, 1000);
}

</script>

<body>

<div class="container">

    <p class="intro">
    A HEARTFELT INVITATION FROM
</p>

    <h1>
        Shiela Mae
        <br>
        &
        <br>
        Brylle Jhon
    </h1>

    <a href="#" class="open-link" onclick="openInvitation(event)">

    <img src="images/envelope.jpg"
    style="width:100%;height:auto;display:block;margin:0 auto;">

</a>

    <a href="#" class="open-link" onclick="openInvitation(event)">
    <div class="tap">
        Tap to Open
    </div>
</a>

</div>

</body>
</html>
