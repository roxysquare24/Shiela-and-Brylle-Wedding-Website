<!DOCTYPE html>
<html>
<head>

<title>S & B Wedding</title>

<style>

body{
    margin:0;
    background:#F5F1EA;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.container{
    width:90%;
    max-width:500px;
}

h1{
    color:#5E7059;
    font-size:60px;
    line-height:1.2;
    margin-bottom:0px;
}

.seal{
    width:90px;
    height:90px;
    background:#7B2D26;
    border-radius:50%;
    color:white;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    margin:auto;
    cursor:pointer;
    text-decoration:none;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.tap{
    color:#5E7059;
    margin-top:8px;
    font-size:18px;
    letter-spacing:1px;
}

.envelope{
    width:100%;
    max-width:450px;
    height:260px;
    background:#A8B493;
    margin:40px auto;
    border-radius:8px;
    position:relative;
}

.envelope:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:225px solid transparent;
    border-right:225px solid transparent;
    border-top:140px solid #93A07F;
}

</style>

</head>

<body>

<div class="container">

    <h1>
        Shiela Mae
        <br>
        &
        <br>
        Brylle Jhon
    </h1>

    <a href="index.html">

    <img src="images/envelope.jpg"
     style="width:340px;height:auto;display:block;margin: 0 auto;">
   

    <div class="tap">
        Tap the Seal to Open
    </div>

</div>

</body>
</html>
